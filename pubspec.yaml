name: pijaredu
description: "PijarEdu - Database Systems learning app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  image_picker: ^1.2.1

  supabase_flutter: ^2.18.0
  google_fonts: ^8.2.1
  smooth_page_indicator: ^3.0.0
  shared_preferences: ^2.5.6
  sqflite: ^2.4.5
  path: ^1.9.1
  file_picker: ^13.3.2
  pdfrx: ^2.12.0
  url_launcher: ^6.3.3
  youtube_player_iframe: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#4540D9"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21

  dependency_overrides:
    flutter_plugin_android_lifecycle: 2.0.22